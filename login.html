<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Mastermind Simulations</title>
  <meta name="description" content="Sign in to Mastermind Simulations." />
  <link rel="icon" type="image/png" href="assets/mastermind-scholars-logo-circle.png" />

  <!-- Locally compiled Tailwind CSS -->
  <link rel="stylesheet" href="tailwind.css" />
  <!-- Local assets keep the site available without internet -->
  <link rel="stylesheet" href="vendor/fontawesome.css" />

  <style>
    html { scroll-behavior: smooth; }
    body {
      background: radial-gradient(circle at 50% 20%, #1e2430 0%, #0d1117 60%, #05070a 100%);
      color: #e5e7eb;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
    }
    /* Glassmorphism helpers */
    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.15); }
    .shiny-btn {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, #ffffff 0%, #d1d5db 50%, #9ca3af 100%);
      color: #05070a;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: all 0.3s ease;
    }
    .shiny-btn:hover { box-shadow: 0 0 35px rgba(255, 255, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 1); transform: translateY(-1px); }
    .shiny-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-solid {
      background: rgba(255, 255, 255, 0.92); color: #05070a; transition: all 0.2s ease;
    }
    .btn-solid:hover { background: #ffffff; box-shadow: 0 0 24px rgba(255, 255, 255, 0.25); }
    .btn-ghost {
      border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.04);
      color: #d1d5db; transition: all 0.2s ease;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.10); color: #ffffff; border-color: rgba(255, 255, 255, 0.3); }
    .navlink { color: #9ca3af; transition: color 0.2s ease; text-decoration: none; }
    .navlink:hover { color: #ffffff; }
    .navlink.on { color: #ffffff; border-bottom-color: rgba(255, 255, 255, 0.7); }
    .site-brand-mark { width: 2.5rem; height: 2.5rem; flex: 0 0 2.5rem; }
    .site-brand-title { white-space: nowrap; letter-spacing: 0.04em; }
    .site-brand-copy { min-width: 0; }
    .font-code { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Consolas, monospace; }

    /* Auth form fields */
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #e5e7eb;
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.8rem;
      padding: 0.6rem 0.8rem;
      width: 100%;
      transition: border-color 0.2s ease;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.4);
    }
    .field-wrapper { position: relative; }
    .toggle-button {
      position: absolute; right: 0.55rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #9ca3af; padding: 0.2rem; line-height: 1;
    }
    .toggle-button:hover { color: #ffffff; }

    .tab-btn {
      font-family: 'Fira Code', monospace; font-size: 0.64rem; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 0.35rem 0.8rem; color: #9ca3af;
      background: transparent; cursor: pointer; transition: all 0.2s ease;
    }
    .tab-btn.on { background: rgba(255, 255, 255, 0.92); color: #05070a; }

    .spinner {
      width: 1rem; height: 1rem; border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .site-brand-mark { width: 2rem; height: 2rem; flex: 0 0 2rem; }
      .site-brand-title { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <main class="relative z-10 flex min-h-screen items-center justify-center p-6">
    <div class="w-full max-w-md">
      <!-- Brand -->
      <div class="text-center mb-6">
        <a href="index.html" class="flex items-center gap-3 no-underline">
          <div class="site-brand-mark bg-white/5 rounded-full flex items-center justify-center overflow-hidden shadow-lg shadow-white/10">
            <img src="assets/mastermind-scholars-logo-circle.png" alt="Mastermind Scholars" class="w-full h-full object-contain" />
          </div>
          <div class="site-brand-copy flex flex-col">
            <span class="site-brand-title font-code font-light tracking-wider text-base text-white">MASTERMIND SCHOLARS</span>
            <span class="text-[9px] uppercase tracking-widest text-gray-400 font-mono -mt-0.5">Simulations · World</span>
          </div>
        </a>
        <h1 class="text-2xl font-code font-light mt-4 text-white">Welcome back</h1>
        <p class="text-gray-400 text-sm">Sign in to continue your learning journey — or create a new account.</p>
      </div>

      <!-- Tabs -->
      <div class="glass-panel p-1 mb-5 flex gap-1 rounded-full" role="tablist" aria-label="Auth method">
        <button class="tab-btn on" id="tab-signin" role="tab" aria-selected="true">Sign In</button>
        <button class="tab-btn" id="tab-signup" role="tab" aria-selected="false">Sign Up</button>
      </div>

      <!-- Form -->
      <form id="auth-form" class="glass-card p-5 space-y-4" novalidate>
        <div class="space-y-1">
          <label class="ctl-label" for="email">Email</label>
          <input id="email" name="email" type="email" class="field-wrapper" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="space-y-1">
          <label class="ctl-label" for="password">Password</label>
          <div class="field-wrapper">
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" id="toggle-password" class="toggle-button" aria-label="Show password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <p id="error" class="text-xs text-red-400 min-h-[1.2em]" role="alert"></p>

        <button type="submit" id="submit-btn" class="shiny-btn w-full">
          <span class="pl-1">Sign In</span>
          <span class="spinner absolute right-3 top-1/2 -translate-y-1/2 hidden" id="spinner"></span>
        </button>
      </form>

      <!-- Toggle -->
      <div class="glass-panel mt-4 text-center">
        <button id="switch-mode" class="btn-ghost" type="button">
          <i class="fa-solid fa-arrow-right-arrow-left mr-1"></i>
          <span id="switch-label">Need an account? Sign Up</span>
        </button>
      </div>

      <div class="mt-3 space-y-2 text-sm" id="reset-section">
        <label class="ctl-label" for="reset-email">Email</label>
        <input id="reset-email" type="email" placeholder="you@example.com" autocomplete="email" class="field-wrapper" />
        <button id="send-reset" class="shiny-btn w-full py-1.5 text-xs" type="button">
          <span class="pl-1">Send reset link</span>
          <span class="spinner absolute right-3 top-1/2 -translate-y-1/2 hidden" id="reset-spinner"></span>
        </button>
        <p id="reset-error" class="text-xs text-red-400 min-h-[1.2em]" role="alert"></p>
        <p class="text-gray-500 text-xs mt-2 text-center">
          <a href="#" id="reset-cancel">Cancel</a>
          <span id="reset-success" class="text-emerald-400 text-xs"></span>
        </p>
      </div>

      <p class="text-gray-500 text-xs mt-3 text-center">
        <a href="index.html" class="navlink">← Back to hub</a>
      </p>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/index.mjs"
      }
    }
  </script>
  <script type="module">
    import { createClient } from "@supabase/supabase-js";
    const SUPABASE_URL = "https://urohhzxsixvviovauszy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PX3fkrgzeVsstAmEGcPMkQ_C50QOTYA";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

      var isSignUp = false;
      var emailInput = document.getElementById("email");
      var passwordInput = document.getElementById("password");
      var form = document.getElementById("auth-form");
      var submitBtn = document.getElementById("submit-btn");
      var spinner = document.getElementById("spinner");
      var errorEl = document.getElementById("error");
      var switchLabel = document.getElementById("switch-label");
      var switchBtn = document.getElementById("switch-mode");
      var tabSignin = document.getElementById("tab-signin");
      var tabSignup = document.getElementById("tab-signup");
      var togglePassword = document.getElementById("toggle-password");
      // --- Forgot password / reset email ---
      var resetSection = document.getElementById("reset-section");
      var resetEmail = document.getElementById("reset-email");
      var sendResetBtn = document.getElementById("send-reset");
      var resetSpinner = document.getElementById("reset-spinner");
      var resetError = document.getElementById("reset-error");
      var resetCancel = document.getElementById("reset-cancel");
      var resetSuccess = document.getElementById("reset-success");

      function setResetLoading(loading) {
        sendResetBtn.disabled = loading;
        resetSpinner.classList.toggle("hidden", !loading);
        sendResetBtn.innerHTML = loading
          ? '<span class="pl-1">Sending…</span>'
          : '<span class="pl-1">Send reset link</span>';
      }

      function showResetError(msg) { resetError.textContent = msg || ""; }
      function clearResetError() { resetError.textContent = ""; }

      resetCancel.addEventListener("click", function () {
        resetSection.style.display = "none";
        resetSuccess.textContent = "";
        clearResetError();
      });

      resetEmail.addEventListener("keydown", function (e) {
        if (e.key === "Enter") sendResetBtn.click();
      });

      sendResetBtn.addEventListener("click", function () {
        var email = resetEmail.value.trim();
        if (!email) {
          showResetError("Please enter your email address.");
          return;
        }
        clearResetError();
        setResetLoading(true);
        supabase.auth.resetPasswordForEmail(email)
          .then(function (res) {
            var error = res.error;
            if (error) {
              showResetError(error.message || "Failed to send reset link.");
              setResetLoading(false);
              return;
            }
            resetSuccess.textContent = "If that account exists, a reset link was sent to your inbox.";
            clearResetError();
            setResetLoading(false);
            resetEmail.value = "";
            setTimeout(function () { resetSection.style.display = "none"; }, 6000);
          })
          .catch(function (err) {
            showResetError(err.message || "Failed to send reset link.");
            setResetLoading(false);
          });
      });

      function showError(msg) {
        errorEl.textContent = msg || "";
      }

      function clearError() {
        errorEl.textContent = "";
      }

      function setSubmitState(disabled, label) {
        submitBtn.disabled = disabled;
        submitBtn.innerHTML = label
          ? '<span class="pl-1">' + label + '</span>'
          : '<span class="pl-1">Sign In</span>';
        spinner.classList.toggle("hidden", !disabled);
      }

      function switchMode() {
        isSignUp = !isSignUp;
        tabSignin.classList.toggle("on", !isSignUp);
        tabSignin.setAttribute("aria-selected", String(!isSignUp));
        tabSignup.classList.toggle("on", isSignUp);
        tabSignup.setAttribute("aria-selected", String(isSignUp));
        var label = isSignUp ? "Already have an account? Sign In" : "Need an account? Sign Up";
        switchLabel.textContent = label;
        clearError();
        setSubmitState(false, isSignUp ? "Create account" : "Sign In");
        passwordInput.setAttribute("autocomplete", isSignUp ? "new-password" : "current-password");
      }

      function setPasswordVisibility() {
        var type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
        passwordInput.setAttribute("type", type);
        togglePassword.innerHTML = type === "password" ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
      }

      function showSupabaseError(err) {
        if (err === null || err === undefined) return;
        if (err instanceof Error) {
          showError(err.message);
        } else if (typeof err === "object" && err.message) {
          showError(err.message);
        } else {
          showError(String(err));
        }
      }

      function resetForm() {
        clearError();
        setSubmitState(false, isSignUp ? "Create account" : "Sign In");
      }

      // --- Tab switching ---
      tabSignin.addEventListener("click", function () {
        if (isSignUp) switchMode();
      });
      tabSignup.addEventListener("click", function () {
        if (!isSignUp) switchMode();
      });
      switchBtn.addEventListener("click", switchMode);

      // --- Password visibility ---
      togglePassword.addEventListener("click", setPasswordVisibility);

      // --- Forgot password (placeholder) ---
      forgotLink.addEventListener("click", function (e) {
        e.preventDefault();
        showError("Password reset is not configured on this deployment. Contact the site owner for access.");
      });

      // --- Authentication ---
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = emailInput.value.trim();
        var password = passwordInput.value;

        if (!email) { showError("Please enter your email."); return; }
        if (!password) { showError("Please enter your password."); return; }

        clearError();
        setSubmitState(true, isSignUp ? "Creating…" : "Signing in…");

        if (isSignUp) {
          supabase.auth.signUp({ email: email, password: password })
            .then(function (res) {
              var data = res.data;
              var error = res.error;
              if (error) { showSupabaseError(error); setSubmitState(false, isSignUp ? "Create account" : "Sign In"); return; }
              if (data.user && data.session) {
                showError("Account created. Signed in successfully.");
                setTimeout(function () { window.location.href = "index.html"; }, 1000);
                return;
              }
              showError(data.user ? "Check your email to confirm your account." : "Something went wrong. Please try again.");
              setSubmitState(false, isSignUp ? "Create account" : "Sign In");
            })
            .catch(function (err) {
              showSupabaseError(err);
              setSubmitState(false, isSignUp ? "Create account" : "Sign In");
            });
        } else {
          supabase.auth.signInWithPassword({ email: email, password: password })
            .then(function (res) {
              var data = res.data;
              var error = res.error;
              if (error) { showSupabaseError(error); setSubmitState(false, "Sign In"); return; }
              showError("Signed in successfully. Redirecting…");
              setTimeout(function () { window.location.href = "index.html"; }, 800);
            })
            .catch(function (err) { showSupabaseError(err); setSubmitState(false, "Sign In"); });
        }
      });

      // Guard: if supabase SDK failed to load
      if (typeof supabase === "undefined") {
        showError("Could not load the authentication service. Please check your connection and reload.");
      }
    </script>
</body>
</html>
